name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub release + MSI"
        type: boolean
        default: true
      bump:
        description: "Version bump part"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-release:
    # Manual: release=true (default on dispatch).
    # Push: any commit in the push whose message includes [release] / [release:bump].
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.release == true) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[release]') ||
        contains(toJSON(github.event.commits.*.message), '[release]')
      ))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          # Need a token that can push the version-bump commit/tags back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve bump type
        id: bump
        shell: pwsh
        run: |
          $bump = "patch"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $bump = "${{ inputs.bump }}"
          } else {
            $msg = @"
          ${{ github.event.head_commit.message }}
          "@
            if ($msg -match '\[release:(major)\]') { $bump = "major" }
            elseif ($msg -match '\[release:(minor)\]') { $bump = "minor" }
            elseif ($msg -match '\[release:(patch)\]' -or $msg -match '\[release\]') { $bump = "patch" }
          }
          echo "BUMP=$bump" >> $env:GITHUB_OUTPUT
          Write-Host "Using bump: $bump"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ensure clean tree for bump2version
        shell: pwsh
        run: |
          # uv must not leave the lockfile dirty; bump2version requires a clean tree.
          git checkout -- uv.lock
          git status --porcelain
          if (git status --porcelain) {
            Write-Host "Working tree still dirty after restoring uv.lock:"
            git status --porcelain
            exit 1
          }

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        # --frozen/--no-sync: plain `uv run` rewrites uv.lock before the tool starts,
        # which makes bump2version abort on a dirty tree.
        run: uv run --frozen --no-sync bump2version ${{ steps.bump.outputs.BUMP }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: uv run --frozen --no-sync pyinstaller macsucks.spec --noconfirm

      - name: Stage release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/msi-stage | Out-Null
          Copy-Item dist/MacSucks.exe dist/msi-stage/MacSucks.exe

      - name: Install WiX
        run: choco install wixtoolset -y

      - name: Patch WiX version
        shell: pwsh
        run: |
          $content = Get-Content installer/macsucks.wxs -Raw
          $content = $content -replace 'ProductVersion = "[^"]+"', 'ProductVersion = "${{ steps.version.outputs.VERSION }}"'
          Set-Content installer/macsucks.wxs $content

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles(x86)\WiX Toolset v3.11\bin;$env:PATH"
          candle.exe installer/macsucks.wxs -out installer/macsucks.wixobj
          light.exe installer/macsucks.wixobj -out MacSucks-${{ steps.version.outputs.VERSION }}.msi

      - name: Push version bump
        shell: pwsh
        run: |
          # GitHub occasionally returns Internal Server Error on push; retry.
          $ok = $false
          foreach ($i in 1..6) {
            git push origin HEAD:master
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "git push failed (attempt $i); waiting..."
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $ok) { throw "git push failed after retries" }

          $ok = $false
          foreach ($i in 1..6) {
            git push origin --tags
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "git push --tags failed (attempt $i); waiting..."
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $ok) { throw "git push --tags failed after retries" }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $msi = "MacSucks-$ver.msi"
          $ok = $false
          foreach ($i in 1..5) {
            gh release create "v$ver" $msi --generate-notes --title "MacSucks v$ver"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            # Release may already exist from a partial prior run.
            if ($i -eq 1) {
              gh release upload "v$ver" $msi --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            }
            Write-Host "gh release failed (attempt $i); waiting..."
            Start-Sleep -Seconds (8 * $i)
          }
          if (-not $ok) { throw "gh release create/upload failed after retries" }
