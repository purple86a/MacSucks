name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub release + MSI"
        type: boolean
        default: false
      bump:
        description: "Version bump part"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  build-release:
    if: inputs.release == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: uv run bump2version ${{ inputs.bump }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: uv run pyinstaller macsucks.spec --noconfirm

      - name: Stage release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/msi-stage | Out-Null
          Copy-Item dist/MacSucks.exe dist/msi-stage/MacSucks.exe

      - name: Install WiX
        run: choco install wixtoolset -y

      - name: Patch WiX version
        shell: pwsh
        run: |
          $content = Get-Content installer/macsucks.wxs -Raw
          $content = $content -replace 'ProductVersion = "[^"]+"', 'ProductVersion = "${{ steps.version.outputs.VERSION }}"'
          Set-Content installer/macsucks.wxs $content

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles(x86)\WiX Toolset v3.11\bin;$env:PATH"
          candle.exe installer/macsucks.wxs -out installer/macsucks.wixobj
          light.exe installer/macsucks.wixobj -out MacSucks-${{ steps.version.outputs.VERSION }}.msi

      - name: Push version bump
        run: git push && git push --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.VERSION }}" "MacSucks-${{ steps.version.outputs.VERSION }}.msi" --generate-notes --title "MacSucks v${{ steps.version.outputs.VERSION }}"
