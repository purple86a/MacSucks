[project]
name = "macsucks"
version = "0.1.0"
description = "Screen region OCR desktop app using LlamaCloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6",
    "llama-cloud>=2.8",
    "mss",
    "pillow",
    "keyboard",
    "psutil",
    "keyring",
    "packaging",
    "httpx",
]

[project.scripts]
macsucks = "macsucks.main:main"

[tool.macsucks]
update_repo_owner = "purple86a"
update_repo_name = "MacSucks"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "bump2version",
    "pyinstaller",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.build-backend]
module-root = "src"
